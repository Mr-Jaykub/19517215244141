# Conda environment for seq2oxdna (Python 3.11, the validated version).
# NUPACK is not on conda or PyPI: install its wheel into this environment afterwards
# (see README, "Install NUPACK").
name: seq2oxdna
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.2.6
  - scipy=1.13.1
  - pandas=2.2.2
  - openpyxl=3.1.5
  - pyyaml
  - jinja2
  - pytest
