name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-22.04 has the validated gcc 11.4 / cmake 3.22 toolchain.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # oxDNA compiles with -march=native (its default, and the validated build), so a binary
      # cached on one runner CPU dies with SIGILL on another: key the cache on the CPU model.
      # v3: every v2 cache held a CMakeCache.txt pointing at a deleted temporary folder (fixed in
      # scripts/install_oxdna.sh), which failed the README check on the first cache hit.
      - name: Identify the runner CPU
        id: cpu
        run: echo "model=$( { grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the oxDNA build
        id: oxdna-cache
        uses: actions/cache@v5
        with:
          path: oxDNA
          key: oxdna-cpu-dbdc7265-ubuntu-22.04-${{ steps.cpu.outputs.model }}-v3

      - name: Build oxDNA (CPU, pinned commit)
        if: steps.oxdna-cache.outputs.cache-hit != 'true'
        run: bash scripts/install_oxdna.sh --prefix oxDNA --jobs 4

      # A normal (non-editable) install, so missing package data would fail the tests.
      - name: Install seq2oxdna
        run: python -m pip install ".[test]"

      # NUPACK cannot be installed here (its licence forbids redistribution), so the
      # NUPACK tests skip; the dot-bracket route and the oxDNA MC stage are tested.
      - name: Tests
        env:
          OXDNA_BIN: ${{ github.workspace }}/oxDNA/build/bin/oxDNA
        run: python -m pytest -rs

      - name: README commands
        env:
          OXDNA_BIN: ${{ github.workspace }}/oxDNA/build/bin/oxDNA
        run: python scripts/check_readme.py --ci
